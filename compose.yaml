name: ${COMPOSE_PROJECT_NAME:-meeting-assistant}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/${S3_BUCKET:-meeting-artifacts};
      mc anonymous set none local/${S3_BUCKET:-meeting-artifacts};
      exit 0;
      "

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-meeting_assistant}
      DB_USERNAME: ${POSTGRES_USER:-meeting_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${S3_BUCKET:-meeting-artifacts}
      AWS_ENDPOINT: http://minio:9000
      AWS_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AI_WORKER_URL: http://worker:8100
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - api-storage:/var/www/html/storage
    command: ["sh", "/var/www/html/docker/start-api.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20

  queue:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-meeting_assistant}
      DB_USERNAME: ${POSTGRES_USER:-meeting_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${S3_BUCKET:-meeting-artifacts}
      AWS_ENDPOINT: http://minio:9000
      AWS_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AI_WORKER_URL: http://worker:8100
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "--queue=default,meetings", "--tries=3", "--timeout=900"]

  scheduler:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-meeting_assistant}
      DB_USERNAME: ${POSTGRES_USER:-meeting_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-meeting_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      api:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  worker:
    build:
      context: ./services/worker
    env_file: .env
    environment:
      PORT: 8100
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-transcribe-diarize}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    ports:
      - "${WORKER_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-storage:
